# ~/.tmux.conf

# プレフィックス: C-Space（メイン）と C-b（予備）
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix       # 2回押しでアプリ側に C-Space を送る
bind C-b     send-prefix -2    # 同じく C-b を送る

# 分割（今いるディレクトリを引き継ぐ）
bind '\' split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"

# マウス: クリックでペイン選択、境界線ドラッグでリサイズ、ホイールでスクロール
set -g mouse on

# 設定の再読み込み: prefix + r
bind r source-file ~/.tmux.conf \; display "reloaded"

# Escキーの待ち時間を短くする
set -sg escape-time 10